# Kamal deploy config for MiniScrap: the Rails app plus FlareSolverr, on ONE host.
#
# Before the first deploy, set (see README → Deploying):
#   MINISCRAP_SERVER          the host's address (app AND FlareSolverr run there)
#   KAMAL_REGISTRY_USERNAME   registry user, e.g. your GitHub user for ghcr.io
#   KAMAL_REGISTRY_PASSWORD   registry token (read by .kamal/secrets)
# and keep config/master.key present (RAILS_MASTER_KEY).
<% server = ENV.fetch("MINISCRAP_SERVER", "203.0.113.10") # TEST-NET placeholder, never a real host %>
<% registry_user = ENV.fetch("KAMAL_REGISTRY_USERNAME", "your-user") %>

service: miniscrap
image: <%= registry_user %>/miniscrap

# A single web host. The clearance cache is per-process memory, so this is one
# host running one Puma process (config/puma.rb refuses WEB_CONCURRENCY > 1)
# until the store is shared (ISSUES.md slice #12).
servers:
  web:
    - <%= server %>

# kamal-proxy in front of the app.
proxy:
  app_port: 80
  # A cold request blocks on a browser solve: up to 60s + a 10s grace.
  response_timeout: 90
  # Stream Server-Sent Events (?stream=true) as they happen instead of
  # buffering the whole response.
  buffering:
    responses: false
  # Liveness only. FlareSolverr health is reported by /ready, so a browser
  # outage never blocks a deploy.
  healthcheck:
    path: /up
  # For HTTPS, add a host and turn on config.assume_ssl / config.force_ssl:
  # ssl: true
  # host: miniscrap.example.com

registry:
  server: ghcr.io
  username: <%= registry_user %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # The accessory below, reached by container name on Kamal's Docker network.
    FLARESOLVERR_URL: http://miniscrap-flaresolverr:8191
    # Threads, not workers (see servers:). A cold request holds a thread for a
    # whole solve (~15s); a herd shares one solve but each waits on a thread.
    RAILS_MAX_THREADS: 16
    # Never set WEB_CONCURRENCY above 1 (see config/puma.rb).

accessories:
  # The slow path's browser. On the SAME host as the app: a Cloudflare
  # clearance is bound to the egress IP that solved it. No `port:`, so it is
  # never published — only the app reaches it, over Kamal's Docker network.
  # Pinned: its Chromium (Chrome 152 in v3.5.2) must stay close to the
  # curl-impersonate profile baked into the image (chrome146).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    host: <%= server %>
    env:
      clear:
        LOG_LEVEL: info

# "bin/kamal <alias>"
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  ready: app exec --reuse "curl -s localhost/ready"

asset_path: /rails/public/assets

builder:
  # The image's curl-impersonate download is the x86_64 build.
  arch: amd64
